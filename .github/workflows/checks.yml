name: Checks

# Repo-specific checks the shared plugin CI (ci.yml: validate + test) does not cover. Both need only
# Node, and neither needs the Claude CLI or its engine types.
#
# 1. The engine's state contract (types/index.d.ts) is generated from the core's types; it must not drift.
# 2. The core (src/core) must stay pure: it is typechecked against the bare language, so a Node, DOM or
#    engine API slipping in fails here. That is what lets every outlet (the Claude pane, a web report, an
#    app) share it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: State contract is in sync with the core's types
        run: node scripts/sync-contract.mjs --check

      - name: Core is pure (typechecks with no host APIs)
        run: npx --yes -p typescript@5 tsc --noEmit -p src/core/tsconfig.json

      - name: Report page script is in sync with the core's generated bundle
        run: node scripts/build-report.mjs --check

      - name: Vendored VisualAssault themes match their pinned tag
        run: node scripts/update-visual-assault-css.mjs --check

      - name: Report page script typechecks
        run: npx --yes -p typescript@5 tsc --noEmit -p src/report/tsconfig.json

  app:
    # The Electron app (app/) shares the core with the plugin. It is built and tested here; its installers are
    # released by auto-release.yml / cut-release.yml through KVG_Standards' release-electron.yml (app_dir: app).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Skip lifecycle scripts: the Electron binary is not needed to typecheck, test or bundle.
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle the main process
        run: npm run build
