# Template: copy to .github/workflows/auto-release.yml in a consumer repo
# and fill in the TODO. Fires a release on EVERY push to main — no manual
# step. Coexists with cut-release.yml: this handles the default
# every-commit-ships case (conventional-commit-driven patch/minor/major
# bump), cut-release.yml stays available for a deliberately-numbered
# release when you want one instead of the auto-bumped version.
#
# The version bump itself (mathieudutour/github-tag-action) reads
# Conventional Commits prefixes across the pushed commits to decide
# patch/minor/major, then creates+pushes the tag. That tag push uses the
# default GITHUB_TOKEN, which normally wouldn't trigger another workflow's
# `on: push: tags` (GitHub suppresses recursive GITHUB_TOKEN-triggered
# runs) — but that doesn't matter here, since the release job below calls
# the build workflow directly via `uses:` in the same run, not by relying
# on the tag push to fire a separate workflow.

name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-claude-plugin.yml@claude/claude-plugin-standard
    with:
      version: ${{ needs.version.outputs.new_tag }}
      plugin_name: shipwatch
    permissions:
      contents: write
