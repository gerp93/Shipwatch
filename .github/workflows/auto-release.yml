# Template: copy to .github/workflows/auto-release.yml in a repo that is a Claude Code plugin AND ships a
# companion Electron app from a subfolder (see claude-plugins.md, "A plugin with a companion app").
# It replaces templates/auto-release.yml for that repo; pair it with cut-release-plugin-app.yml.
#
# Every push to main bumps the version, tags it, and publishes the plugin's release. The app's installers
# are added to that same release, but only when the push touched the app or code it shares: a reusable
# workflow cannot filter by path, so the filter lives here in the caller. Edit the `paths` list to match.

name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              # Code the app shares with the plugin. Keep in step with what app/ imports.
              - 'src/core/**'
              - 'src/report/**'
              - 'scripts/build-report.mjs'

  plugin:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-claude-plugin.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      plugin_name: shipwatch # as listed in .claude-plugin/marketplace.json
    permissions:
      contents: write

  app:
    # After the plugin job, which creates the release the installers are added to.
    needs: [version, changes, plugin]
    if: ${{ needs.version.outputs.new_tag != '' && needs.changes.outputs.app == 'true' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-electron.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      app_dir: app
      skip_release_notes: true # the plugin job wrote the release text
    permissions:
      contents: write
